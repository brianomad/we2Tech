name: blog-bot

on:
  schedule:
    - cron: '0 2 1,15 * *'
  workflow_dispatch:
    inputs:
      count:
        description: Number of posts to publish this run (default 2)
        required: false
        default: '2'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish queued blog posts
        env:
          BLOG_BOT_COUNT: ${{ github.event.inputs.count || '2' }}
        run: node scripts/blog-bot/index.js
